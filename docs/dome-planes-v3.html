          function setAlpha(material, value) {
            if (useOIT) material.uniforms.alpha.value = value;
            else material.opacity = value;
          }
          function drawScene() {
            if (!useOIT) {
              renderer.render(scene, camera);
              return;
            }
            renderer.setRenderTarget(baseTarget);
            renderer.setClearColor(0x000000, 0);
            renderer.clear();
            renderer.render(scene, camera);
            passUniform.value = 0;
            for (var i = 0; i < rowObjects.length; i++)
              if (rowObjects[i]) {
                rowObjects[i].fill.blendSrc = rowObjects[i].edge.blendSrc =
                  THREE.OneFactor;
                rowObjects[i].fill.blendDst = rowObjects[i].edge.blendDst =
                  THREE.OneFactor;
              }
            renderer.setRenderTarget(accumTarget);
            renderer.setClearColor(0x000000, 0);
            renderer.clear();
            renderer.render(oitScene, camera);
            passUniform.value = 1;
            for (var j = 0; j < rowObjects.length; j++)
              if (rowObjects[j]) {
                rowObjects[j].fill.blendSrc = rowObjects[j].edge.blendSrc =
                  THREE.ZeroFactor;
                rowObjects[j].fill.blendDst = rowObjects[j].edge.blendDst =
                  THREE.OneMinusSrcAlphaFactor;
              }
            renderer.setRenderTarget(revealTarget);
            renderer.setClearColor(0xffffff, 1);
            renderer.clear();
            renderer.render(oitScene, camera);
            renderer.setRenderTarget(null);
            renderer.setClearColor(0x000000, 0);
            renderer.clear();
            renderer.render(compositeScene, compositeCamera);
          }

          var rowObjects = [];
          var hovered = -1;

          function familyColor(row) {
            var t = (row.k - 7) / 8.0;
            return new THREE.Color()
              .setHSL(row.family.hue, 0.65, 0.58 + 0.18 * t)
              .convertSRGBToLinear();
          }

          function buildPlane(row) {
            var polys = window.DomeMath.planePolygons(row);
            if (polys.length === 0) return null;

            var positions = [];
            var edges = [];
            for (var pi = 0; pi < polys.length; pi++) {
              var poly = polys[pi];
              var n = poly.length;
              for (var i = 1; i + 1 < n; i++) {
                positions.push(
                  poly[0][0] * UNIT,
                  poly[0][1] * UNIT,
                  poly[0][2] * UNIT,
                  poly[i][0] * UNIT,
                  poly[i][1] * UNIT,
                  poly[i][2] * UNIT,
                  poly[i + 1][0] * UNIT,
                  poly[i + 1][1] * UNIT,
                  poly[i + 1][2] * UNIT,
                );
              }
              for (var j = 0; j < n; j++) {
                var p = poly[j];
                var q = poly[(j + 1) % n];
                edges.push(
                  p[0] * UNIT,
                  p[1] * UNIT,
                  p[2] * UNIT,
                  q[0] * UNIT,
                  q[1] * UNIT,
                  q[2] * UNIT,
                );
              }
            }

            var color = familyColor(row);
            var fillGeometry = new THREE.BufferGeometry();
            fillGeometry.setAttribute(
              "position",
              new THREE.Float32BufferAttribute(positions, 3),
            );
            var fillMaterial = surfaceMaterial(color, false);
            var mesh = new THREE.Mesh(fillGeometry, fillMaterial);
            mesh.userData.rowIndex = row.index;

            var edgeGeometry = new THREE.BufferGeometry();
            edgeGeometry.setAttribute(
              "position",
              new THREE.Float32BufferAttribute(edges, 3),
            );
            var edgeMaterial = surfaceMaterial(
              color.clone().lerp(new THREE.Color(0xffffff), 0.12),
              true,
            );
            var outline = new THREE.LineSegments(edgeGeometry, edgeMaterial);

            var object = new THREE.Group();
            object.add(mesh);
            object.add(outline);
            object.userData.rowIndex = row.index;

            rowObjects[row.index] = {
              object: object,
              mesh: mesh,
              fill: fillMaterial,
              edge: edgeMaterial,
              outline: outline,
              visibility: 0,
              targetVisibility: 1,
              focus: 0,
            };
            return object;
          }

          function setHovered(index) {
            if (hovered === index) return;
            hovered = index;
            invalidate();
            // 有固定项时悬停不再改变任何高亮；信息框仍跟随指针。
            if (pinnedCount === 0) ui.markCard(index);
            ui.showInfo(index);
          }

          ui.setHighlight(setHovered);

          // 逐项开关：关掉的项整组隐藏，悬停命中也会跳过它。
          gl.setVisible = function (index, visible) {
            var entry = rowObjects[index];
            if (!entry) return;
            entry.targetVisibility = visible !== false ? 1 : 0;
            if (entry.targetVisibility) entry.object.visible = true;
            if (!entry.targetVisibility && hovered === index) setHovered(-1);
            invalidate();
          };

          // ---- 渲染一批行 ----

          gl.render = function (rows) {
            for (var i = 0; i < rowObjects.length; i++) {
              var entry = rowObjects[i];
              if (!entry) continue;
              planes.remove(entry.object);
              entry.mesh.geometry.dispose();
              entry.fill.dispose();
              entry.outline.geometry.dispose();
              entry.edge.dispose();
            }
            rowObjects.length = 0;
            hovered = -1;
            for (var pk in pinned) {
              ui.pinCard(Number(pk), false);
              delete pinned[pk];
            }
            pinnedCount = 0;
            ui.showInfo(-1);

            for (var j = 0; j < rows.length; j++) {
              var object = buildPlane(rows[j]);
              if (object) planes.add(object);
            }
            // 按界面当前的开关状态落一次可见性。
            for (var k = 0; k < rows.length; k++) {
              var entry = rowObjects[rows[k].index];
              if (entry) {
                entry.targetVisibility = ui.isEnabled(rows[k].index) ? 1 : 0;
                entry.object.visible = !!entry.targetVisibility;
              }
            }
            resize();
          };

          // ---- 交互：只旋转与缩放 ----

          var dragging = false;
          var lastX = 0;
          var lastY = 0;

          canvas.addEventListener("contextmenu", function (e) {
            e.preventDefault();
            if (dragging) return;
            openMenu(e);
          });
          canvas.addEventListener("auxclick", function (e) {
            e.preventDefault();
          });

          canvas.addEventListener("pointerdown", function (e) {
            hideMenu();
            if (e.button !== 0) return;
            dragging = true;
            setHovered(-1);
            lastX = e.clientX;
            lastY = e.clientY;
            canvas.setPointerCapture(e.pointerId);
          });

          canvas.addEventListener("pointerup", function (e) {
            dragging = false;
            if (canvas.hasPointerCapture(e.pointerId))
              canvas.releasePointerCapture(e.pointerId);
          });

          canvas.addEventListener("pointercancel", function () {
            dragging = false;
          });
          canvas.addEventListener("lostpointercapture", function () {
            dragging = false;
          });
          canvas.addEventListener("pointerleave", function () {
            if (!dragging) setHovered(-1);
          });

          canvas.addEventListener("pointermove", function (e) {
            if (dragging) {
              targetTheta -= (e.clientX - lastX) * 0.004;
              targetPhi -= (e.clientY - lastY) * 0.004;
              targetPhi = Math.max(0.02, Math.min(Math.PI - 0.02, targetPhi));
              lastX = e.clientX;
              lastY = e.clientY;
              clearViewSelection();
              invalidate();
            } else {
              probe(e);
            }
          });

          // 滚轮挂在整块右侧区域上，而不是只挂画布，避免指针落在画布之外时滚到别处。
          stage.addEventListener(
            "wheel",
            function (e) {
              e.preventDefault();
              hideMenu();
              var delta =
                e.deltaY *
                (e.deltaMode === 1
                  ? 16
                  : e.deltaMode === 2
                    ? stage.clientHeight
                    : 1);
              targetRadius = Math.max(
                MIN_RADIUS,
                Math.min(MAX_RADIUS, targetRadius * Math.exp(delta * 0.0012)),
              );
              setHovered(-1);
              invalidate();
            },
            { passive: false },
          );

          var raycaster = new THREE.Raycaster();
          var pointer = new THREE.Vector2();

          function pointerNdc(e) {
            var rect = canvas.getBoundingClientRect();
            pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
          }

          function visiblePlaneMeshes() {
            var meshes = [];
            for (var i = 0; i < rowObjects.length; i++) {
              if (rowObjects[i] && rowObjects[i].targetVisibility > 0)
                meshes.push(rowObjects[i].mesh);
            }
            return meshes;
          }

          function probe(e) {
            pointerNdc(e);
            raycaster.setFromCamera(pointer, camera);
            var hits = raycaster.intersectObjects(visiblePlaneMeshes(), false);
            if (hits.length === 0) {
              setHovered(-1);
              return;
            }
            setHovered(hits[0].object.userData.rowIndex);
          }

          // ---- 右键菜单：复制指针所指点的方块坐标 ----

          var ctxMenu = document.getElementById("ctx-menu");
          var ctxCopy = document.getElementById("ctx-copy");
          var ctxPin = document.getElementById("ctx-pin");
          var ctxGoto = document.getElementById("ctx-goto");
          var gotoPanel = document.getElementById("goto-panel");
          var gotoX = document.getElementById("goto-x");
          var gotoY = document.getElementById("goto-y");
          var gotoZ = document.getElementById("goto-z");
          var gotoApply = document.getElementById("goto-apply");
          var gotoError = document.getElementById("goto-error");
          /** 最近一次右键的位置，面板照着它摆。 */
          var lastPointer = null;
          var ctxTarget = null;
          /** 右键当前指向的行；坐标轴时为 -1。 */
          var ctxRowIndex = -1;
          /** 已固定的行：常驻高亮，固定期间悬停不再改变任何高亮。 */
          var pinned = {};
          var pinnedCount = 0;
          function setPinned(index, on) {
            if (on) {
              if (!pinned[index]) {
                pinned[index] = true;
                pinnedCount++;
              }
            } else if (pinned[index]) {
              delete pinned[index];
              pinnedCount--;
            }
            ui.pinCard(index, on);
            if (pinnedCount > 0) ui.markCard(-1);
            invalidate();
          }
          var BLOCK_UNIT = 2147483648.0;
          var BLOCK_MIN = -2147483648;
          var BLOCK_MAX = 2147483647;

          function clampBlock(v) {
            var r = Math.round(v);
            if (!isFinite(r)) return 0;
            if (r > BLOCK_MAX) return BLOCK_MAX;
            if (r < BLOCK_MIN) return BLOCK_MIN;
            return r;
          }

          /** 相机射线与平面方程 a x + (b/2) y + c z + T_k d = 0 的交点，方块坐标。 */
          function blockOfPlane(ray, row, hitPoint) {
            var a = row.abcd[0];
            var hb = row.abcd[1] / 2;
            var c = row.abcd[2];
            var k = row.t * row.abcd[3];
            var ox = ray.origin.x * BLOCK_UNIT;
            var oy = ray.origin.y * BLOCK_UNIT;
            var oz = ray.origin.z * BLOCK_UNIT;
            var dx = ray.direction.x * BLOCK_UNIT;
            var dy = ray.direction.y * BLOCK_UNIT;
            var dz = ray.direction.z * BLOCK_UNIT;
            var denom = a * dx + hb * dy + c * dz;
            if (denom === 0) {
              // 射线与平面平行，解析解不存在；退回射线命中点，它已是 float32 精度。
              if (!hitPoint) return null;
              return [
                hitPoint.x * BLOCK_UNIT,
                hitPoint.y * BLOCK_UNIT,
                hitPoint.z * BLOCK_UNIT,
              ];
            }
            var t = -(a * ox + hb * oy + c * oz + k) / denom;
            if (!isFinite(t)) return null;
            return [ox + t * dx, oy + t * dy, oz + t * dz];
          }

          /** 射线与某条坐标轴最近点在轴上的坐标值，方块单位。 */
          function axisCoordOf(ray, axis) {
            var o = [
              ray.origin.x * BLOCK_UNIT,
              ray.origin.y * BLOCK_UNIT,
              ray.origin.z * BLOCK_UNIT,
            ];
            var d = [
              ray.direction.x * BLOCK_UNIT,
              ray.direction.y * BLOCK_UNIT,
              ray.direction.z * BLOCK_UNIT,
            ];
            var e = [
              axis === "x" ? 1 : 0,
              axis === "y" ? 1 : 0,
              axis === "z" ? 1 : 0,
            ];
            var dd = d[0] * d[0] + d[1] * d[1] + d[2] * d[2];
            var de = d[0] * e[0] + d[1] * e[1] + d[2] * e[2];
            var eo = e[0] * o[0] + e[1] * o[1] + e[2] * o[2];
            var od = o[0] * d[0] + o[1] * d[1] + o[2] * d[2];
            var denom = dd - de * de;
            // 射线与轴平行时最近点对不唯一，取射线起点在该轴上的投影。
            if (Math.abs(denom) < 1e-9) return eo;
            var t = (eo * de - od) / denom;
            return t * de + eo;
          }

          function hideMenu() {
            ctxMenu.hidden = true;
            // 定位面板与右键菜单是同一批浮层，同一批手势一起收。
            gotoPanel.hidden = true;
            ctxTarget = null;
            ctxRowIndex = -1;
          }

          /** 把浮层摆在指针处，越出可视区就夹回来。 */
          function placeOverlay(el, clientX, clientY) {
            var rect = stage.getBoundingClientRect();
            var x = clientX - rect.left + 2;
            var y = clientY - rect.top + 2;
            el.style.left =
              Math.max(2, Math.min(x, stage.clientWidth - el.offsetWidth - 4)) +
              "px";
            el.style.top =
              Math.max(2, Math.min(y, stage.clientHeight - el.offsetHeight - 4)) +
              "px";
          }

          function openMenu(e) {
            pointerNdc(e);
            raycaster.setFromCamera(pointer, camera);
            var planeHits = raycaster.intersectObjects(
              visiblePlaneMeshes(),
              false,
            );
            var axisHits = raycaster.intersectObjects(axisPicks, false);
            var markHits = markGroup.visible
              ? raycaster.intersectObject(markMesh, false)
              : [];
            // 取最上层：几种命中里离相机更近的那一个。
            var best = null;
            var planeHit = null;
            if (markHits.length > 0) {
              best = { kind: "mark", distance: markHits[0].distance };
            }
            if (
              axisHits.length > 0 &&
              (best === null || axisHits[0].distance < best.distance)
            ) {
              best = {
                kind: "axis",
                axis: axisHits[0].object.userData.axis,
                distance: axisHits[0].distance,
              };
            }
            if (
              planeHits.length > 0 &&
              (best === null || planeHits[0].distance < best.distance)
            ) {
              best = {
                kind: "plane",
                index: planeHits[0].object.userData.rowIndex,
                distance: planeHits[0].distance,
              };
              planeHit = planeHits[0];
            }
            if (best === null) {
              // 虚空：只给定位。
              lastPointer = { x: e.clientX, y: e.clientY };
              ctxTarget = null;
              ctxRowIndex = -1;
              ctxCopy.hidden = true;
              ctxPin.hidden = true;
              ctxGoto.hidden = false;
              ctxMenu.hidden = false;
              placeOverlay(ctxMenu, e.clientX, e.clientY);
              return;
            }

            var block = null;
            if (best.kind === "mark") {
              block = markBlock ? [markBlock.x, markBlock.y, markBlock.z] : null;
            } else if (best.kind === "plane") {
              var rows = ui.getRows() || [];
              var row = rows[best.index - 1];
              if (!row) {
                hideMenu();
                return;
              }
              block = blockOfPlane(
                raycaster.ray,
                row,
                planeHit ? planeHit.point : null,
              );
            } else {
              var s = axisCoordOf(raycaster.ray, best.axis);
              if (s === null) {
                hideMenu();
                return;
              }
              block =
                best.axis === "x"
                  ? [s, 0, 0]
                  : best.axis === "y"
                    ? [0, s, 0]
                    : [0, 0, s];
            }
            if (block === null) {
              hideMenu();
              return;
            }

            ctxTarget =
              "/tp @s " +
              clampBlock(block[0]) +
              " " +
              clampBlock(block[1]) +
              " " +
              clampBlock(block[2]);
            ctxCopy.textContent = "复制坐标";
            ctxCopy.hidden = false;
            ctxGoto.hidden = true;
            lastPointer = { x: e.clientX, y: e.clientY };
            ctxRowIndex = best.kind === "plane" ? best.index : -1;
            ctxPin.hidden = ctxRowIndex < 0;
            ctxPin.textContent =
              ctxRowIndex >= 0 && pinned[ctxRowIndex] ? "取消固定" : "固定";
            ctxMenu.hidden = false;
            placeOverlay(ctxMenu, e.clientX, e.clientY);
          }

          function copyText(text, onOk, onFail) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(text).then(onOk, function () {
                legacyCopy(text, onOk, onFail);
              });
              return;
            }
            legacyCopy(text, onOk, onFail);
          }

          function legacyCopy(text, onOk, onFail) {
            var area = document.createElement("textarea");
            area.value = text;
            area.style.position = "fixed";
            area.style.left = "-9999px";
            document.body.appendChild(area);
            area.select();
            var ok = false;
            try {
              ok = document.execCommand("copy");
            } catch (err) {
              ok = false;
            }
            document.body.removeChild(area);
            if (ok) {
              onOk();
            } else {
              onFail();
            }
          }

          ctxCopy.addEventListener("click", function () {
            if (ctxTarget === null) return;
            copyText(
              ctxTarget,
              function () {
                ctxCopy.textContent = "已复制";
                setTimeout(hideMenu, 600);
              },
              function () {
                ctxCopy.textContent = "复制失败";
              },
            );
          });

          ctxPin.addEventListener("click", function () {
            if (ctxRowIndex < 0) return;
            var index = ctxRowIndex;
            setPinned(index, !pinned[index]);
            hideMenu();
          });

          ctxGoto.addEventListener("click", function () {
            var at = lastPointer || { x: 0, y: 0 };
            hideMenu();
            gotoError.hidden = true;
            gotoPanel.hidden = false;
            placeOverlay(gotoPanel, at.x, at.y);
            if (gotoX.focus) gotoX.focus();
          });

          function parseBlock(text) {
            var s = String(text).trim();
            if (!/^[+-]?[0-9]+$/.test(s)) return null;
            var v = Number(s);
            if (!isFinite(v) || v < BLOCK_MIN || v > BLOCK_MAX) return null;
            return Math.round(v);
          }

          /**
           * 把相机平滑转到该点所在方向。相机始终看着原点，所以该点要落在视轴上就得
           * 让相机方向取该点方向的反向；距离取页面自己的适配半径。
           */
          function goTo(bx, by, bz) {
            // 方块坐标是整数，没有方向的只有原点本身；归一化尺度上的阈值会把原点附近
            // 上千格的合法点一起判成原点。
            if (bx === 0 && by === 0 && bz === 0) return false;
            var px = bx / BLOCK_UNIT;
            var py = by / BLOCK_UNIT;
            var pz = bz / BLOCK_UNIT;
            var len = Math.sqrt(px * px + py * py + pz * pz);
            if (!(len > 0)) return false;
            var wantedPhi = Math.acos(Math.max(-1, Math.min(1, -py / len)));
            var wantedTheta = Math.atan2(-px / len, -pz / len);
            targetTheta =
              theta +
              Math.atan2(
                Math.sin(wantedTheta - theta),
                Math.cos(wantedTheta - theta),
              );
            targetPhi = Math.max(0.02, Math.min(Math.PI - 0.02, wantedPhi));
            targetFocus.set(px, py, pz);
            targetRadius = radiusForBlocks(LOCATE_BLOCKS);
            markBlock = { x: bx, y: by, z: bz };
            markGroup.position.set(px, py, pz);
            markGroup.visible = true;
            clearViewSelection();
            hideMenu();
            invalidate();
            return true;
          }

          function applyGoto() {
            var bx = parseBlock(gotoX.value);
            var by = parseBlock(gotoY.value);
            var bz = parseBlock(gotoZ.value);
            if (bx === null || by === null || bz === null) {
              gotoError.textContent =
                "三个坐标都要是 [-2147483648, 2147483647] 内的整数。";
              gotoError.hidden = false;
              return;
            }
            if (!goTo(bx, by, bz)) {
              gotoError.textContent = "原点没有方向，换一个点。";
              gotoError.hidden = false;
            }
          }

          gotoApply.addEventListener("click", applyGoto);
          [gotoX, gotoY, gotoZ].forEach(function (input) {
            input.addEventListener("keydown", function (e) {
              if (e.key === "Enter") applyGoto();
            });
          });

          window.addEventListener("keydown", function (e) {
            if (e.key === "Escape") hideMenu();
          });
          window.addEventListener("blur", hideMenu);

          // ---- 尺寸与渲染循环 ----

          function resize() {
            var width = stage.clientWidth;
            var height = stage.clientHeight;
            if (width === 0 || height === 0) return;
            renderer.setPixelRatio(
              Math.min(
                2,
                Math.max(2, window.devicePixelRatio || 1),
                Math.max(1, Math.sqrt(5000000 / (width * height))),
              ),
            );
            renderer.setSize(width, height, false);
            if (useOIT) {
              var size = renderer.getDrawingBufferSize(new THREE.Vector2());
              accumTarget.setSize(size.x, size.y);
              revealTarget.setSize(size.x, size.y);
              baseTarget.setSize(size.x, size.y);
              sizeUniform.value.copy(size);
            }
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            var nextFit = fitRadius();
            if (lastFit) {
              radius = Math.max(
                MIN_RADIUS,
                Math.min(MAX_RADIUS, (radius * nextFit) / lastFit),
              );
              targetRadius = Math.max(
                MIN_RADIUS,
                Math.min(MAX_RADIUS, (targetRadius * nextFit) / lastFit),
              );
            }
            lastFit = nextFit;
            updateAxisWidth();
            invalidate();
          }

          gl.resize = resize;
          window.addEventListener("resize", resize);
          // 面板列表出现滚动条、字体或布局变化都会改右侧区域的尺寸，
          // 只监听 window 的 resize 不够，量晚了画面会被拉伸或发虚。
          if (window.ResizeObserver) {
            new window.ResizeObserver(function () {
              resize();
            }).observe(stage);
          }

          function loop(now) {
            raf = 0;
            var dt = Math.min((now - lastFrame) / 1000 || 1 / 60, 0.1);
            lastFrame = now;
            var blend = reducedMotion.matches ? 1 : 1 - Math.exp(-dt * 15);
            var moving = false;
            function approach(current, target) {
              if (Math.abs(current - target) < 0.0001) return target;
              moving = true;
              return current + (target - current) * blend;
            }
            theta = approach(theta, targetTheta);
            phi = approach(phi, targetPhi);
            radius = approach(radius, targetRadius);
            focus.x = approach(focus.x, targetFocus.x);
            focus.y = approach(focus.y, targetFocus.y);
            focus.z = approach(focus.z, targetFocus.z);
            // 标记按世界半径画，跟场景一起缩放；只在屏幕上小到 4 像素时不再缩，
            // 既看着像场景里的物体，又不会缩远之后找不回来。
            var markHalfFov = Math.tan((camera.fov * Math.PI) / 360);
            var markPixelFloor =
              (4 * radius * markHalfFov) / Math.max(stage.clientHeight, 1);
            var markScale = Math.max(MARK_RADIUS, markPixelFloor);
            markGroup.scale.set(markScale, markScale, markScale);
            for (var i = 0; i < rowObjects.length; i++) {
              var entry = rowObjects[i];
              if (!entry) continue;
              entry.visibility = approach(
                entry.visibility,
                entry.targetVisibility,
              );
              entry.focus = approach(
                entry.focus,
                pinned[i]
                  ? 1
                  : pinnedCount > 0
                    ? 0
                    : hovered < 0
                      ? 0
                      : hovered === i
                        ? 1
                        : -1,
              );
              entry.object.visible = entry.visibility > 0.0001;
              var opacity =
                entry.focus >= 0
                  ? 0.28 + entry.focus * 0.26
                  : 0.28 + entry.focus * 0.18;
              setAlpha(entry.fill, entry.visibility * opacity);
              setAlpha(
                entry.edge,
                entry.visibility * (0.54 + entry.focus * 0.3),
              );
            }
            updateCamera();
            camera.updateMatrixWorld();
            drawScene();
            updateLabels();
            if (moving) invalidate();
          }
          document.addEventListener("visibilitychange", function () {
            if (document.hidden) {
              cancelAnimationFrame(raf);
              raf = 0;
            } else {
              lastFrame = performance.now();
              invalidate();
            }
          });
          canvas.addEventListener("webglcontextlost", function (e) {
            e.preventDefault();
            cancelAnimationFrame(raf);
            raf = 0;
            ui.setStatus("WebGL 上下文已丢失，正在等待恢复。", true);
          });
          canvas.addEventListener("webglcontextrestored", function () {
            ui.hideStatus();
            resize();
            invalidate();
          });
          resize();
          radius = targetRadius = fitRadius();
          updateCamera();
          invalidate();

          // 界面脚本先于本脚本运行，默认种子那一批可能在 enqueue 之前就产出了，
          // 所以这里既收 pending，也直接向界面取当前行，保证首批一定画出来。
          var initialRows = gl.pending || ui.getRows();
          gl.pending = null;
          if (initialRows) gl.render(initialRows);

          window.__DOME_READY = true;
        }

        // ---- 逐个候选源加载 ----
        // 中间态只进控制台：状态行只在初始与最终失败两个稳定态渲染，避免随候选源切换频闪。

        function logStatus(text) {
          if (window.console && console.log) console.log("三维：" + text);
        }

        function tryUmd(i) {
          if (i >= UMD_SOURCES.length) return tryEsm(0);
          var url = UMD_SOURCES[i];
          logStatus("尝试全局构建 " + url);
          loadScript(url, 15000)
            .then(function () {
              if (window.THREE) {
                boot(window.THREE, url);
              } else {
                logStatus(url + " 加载后没有 THREE 全局");
                tryUmd(i + 1);
              }
            })
            .catch(function (e) {
              logStatus(url + " 失败，" + e.message);
              tryUmd(i + 1);
            });
        }

        function tryEsm(i) {
          if (i >= ESM_SOURCES.length) return failAll();
          var url = ESM_SOURCES[i];
          logStatus("尝试模块构建 " + url);
          import(url)
            .then(function (mod) {
              boot(mod, url);
            })
            .catch(function (e) {
              logStatus(url + " 失败，" + (e && e.message ? e.message : e));
              tryEsm(i + 1);
            });
        }

        if (window.THREE) boot(window.THREE, "bundled r149");
        else tryUmd(0);
      })();
    </script>
  </body>
</html>
